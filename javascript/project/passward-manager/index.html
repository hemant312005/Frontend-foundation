<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="bg-primary d-flex p-5 column-gap-xl-5" id="primary">
        <i class="bi bi-file-lock"></i>
        <p class="fs-2 text-light lh-1" >Password Manager <br> <span class="fs-5 ">Store your website credentials securely</span></p>
        <div>
         <button id="addbtn">Add Password</button>
         <div id="form" style="display:none">
            <div>
               <p>Website Name</p>
               <input type="text" id="websiteName">
            </div>
            <div>
               <p>Website URL</p>
               <input type="text" id="websiteUrl">
            </div>
            <div>
               <p>Username URL</p>
               <input type="text" id="userName">
            </div>
            <div>
               <p>Password</p>
               <input type="text" id="password">
            </div>
            <button id="savebtn">save password</button>
          </div>
        </div>
        
     </div>
     <div>
        <input type="text" name="" id="search">
        <button></button>
     </div>
     <div>
      <table class="table table-bordered" id="table">
         <tr>
            <th>Website</th>
            <th>Username/Email</th>
            <th>Password</th>
            <th>Actions</th>
         </tr>
      </table>
     </div>
    <script src="script.js"></script>
</body>
</html>
